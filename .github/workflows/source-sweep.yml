name: Source sweep (manual)

# Runs published Mangayomi extensions against their real sites, chaining
# getPopular -> getDetail -> getPageList.
#
# Deliberately NEVER gates a pull request. It needs the open internet and
# third-party manga sites, which go down, move domain and serve Cloudflare
# challenges for reasons that have nothing to do with this repository. A red
# sweep is information, not a build failure.
on:
    workflow_dispatch:
        inputs:
            source:
                description: "Filter by source name or script URL (e.g. madara). Blank = all English/all-language Dart sources."
                required: false
                default: ""
            limit:
                description: "Maximum number of sources to sweep. Blank = no limit."
                required: false
                default: ""

permissions:
    contents: read

jobs:
    sweep:
        name: Sweep live sources
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

            - name: Set up Flutter
              uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
              with:
                  flutter-version: 3.47.4
                  channel: stable
                  cache: true

            - name: Resolve dependencies
              run: flutter pub get

            - name: Sweep
              run: |
                  flutter test tool/source_sweep.dart \
                      --dart-define=SOURCE='${{ inputs.source }}' \
                      --dart-define=LIMIT='${{ inputs.limit }}'
