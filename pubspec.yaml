name: otaku_reader
description: "A manga and manhwa reader built on the Mangayomi extension ecosystem."
publish_to: "none"
version: 0.1.0+1

environment:
    sdk: ">=3.13.0 <4.0.0"
    flutter: ">=3.47.0"

# Dependencies are added per phase, as the code that uses them lands. Declaring
# the whole eventual set up front drags in Android plugins that lag the app's
# compileSdk and fail the build for features that do not exist yet.
dependencies:
    flutter:
        sdk: flutter

    # ── State management + DI ──
    get: ^4.7.3

    # ── Persistence ──
    isar_community: ^3.3.2
    isar_community_flutter_libs: ^3.3.2
    path: ^1.9.0
    path_provider: ^2.1.5

    # ── Extension runtime (phase 1) ──
    d4rt: ^0.2.4
    html: ^0.15.6
    xpath_selector_html_parser: ^3.0.1
    pseudom: ^1.0.1
    js_packer: ^0.0.6
    crypto: ^3.0.7
    encrypt: ^5.0.3
    convert: ^3.1.1

    # ── Networking (phase 1) ──
    # Extensions construct `Client()` and call package:http methods on it, so
    # http is the surface the bridge must present; http_interceptor supplies the
    # header/cookie/Cloudflare hooks around it.
    http: ^1.2.2
    http_interceptor: ^2.0.0

    # ── UI ──
    dynamic_color: ^1.7.0
    iconsax: ^0.0.8

    # ── Misc ──
    intl: ^0.20.1
    collection: ^1.19.0
    # Referenced transitively by isar's native bindings; declared so the
    # analyzer's depend_on_referenced_packages lint is satisfied honestly.
    ffi: ^2.1.3

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^5.0.0
    build_runner: ^2.4.11
    isar_community_generator:
        git:
            url: https://github.com/kodjodevf/isar-community-generator.git
            ref: v3

flutter:
    uses-material-design: true
