name: otaku_reader
description: "A manga and manhwa reader built on the Mangayomi extension ecosystem."
publish_to: "none"
version: 0.1.0+1

environment:
    sdk: ">=3.13.0 <4.0.0"
    flutter: ">=3.47.0"

# Dependencies are added per phase, as the code that uses them lands. Declaring
# the whole eventual set up front drags in Android plugins that lag the app's
# compileSdk and fail the build for features that do not exist yet.
dependencies:
    flutter:
        sdk: flutter

    # ── State management + DI ──
    get: ^4.7.3

    # ── Persistence ──
    # Tracker tokens go here, never the KV tier: that table is a plain Isar
    # collection a backup would carry off in clear text. AnymeX keeps its auth
    # tokens in its own KV table, which is one of the things this app
    # deliberately does not copy.
    flutter_secure_storage: ^9.2.4
    isar_community: ^3.3.2
    isar_community_flutter_libs: ^3.3.2
    path: ^1.9.0
    path_provider: ^2.1.5

    # ── Extension runtime (phase 1) ──
    d4rt: ^0.2.4
    html: ^0.15.6
    xpath_selector_html_parser: ^3.0.1
    pseudom: ^1.0.1
    js_packer: ^0.0.6
    crypto: ^3.0.7
    encrypt: ^5.0.3
    convert: ^3.1.1

    # ── Networking (phase 1) ──
    # Extensions construct `Client()` and call package:http methods on it, so
    # http is the surface the bridge must present; http_interceptor supplies the
    # header/cookie/Cloudflare hooks around it.
    http: ^1.2.2
    http_interceptor: ^2.0.0

    # ── UI ──
    dynamic_color: ^1.7.0
    iconsax: ^0.0.8
    # Covers scroll past in their hundreds and are re-shown constantly, so they
    # want a disk cache, not just Flutter's in-memory ImageCache. Added in
    # phase 2 with the browse grid, which is the first code that needs it.
    cached_network_image: ^3.4.1

    # ── Misc ──
    intl: ^0.20.1
    collection: ^1.19.0
    # Added in phase 5, with the two screens that need them: About shows the
    # build's own version, and AniList's external-link chips had a no-op tap
    # handler until there was something to open them with.
    package_info_plus: ^8.1.1
    url_launcher: ^6.3.1
    # Added with the reader's "Keep the screen on" switch, which had shipped as
    # a live control with no implementation behind it. AnymeX uses this same
    # package for the same setting; it is reached through `ScreenWakelock` so a
    # host-VM test can observe it, because the plugin itself is a static
    # platform channel.
    wakelock_plus: ^1.3.3

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^5.0.0
    build_runner: ^2.4.11
    isar_community_generator:
        git:
            url: https://github.com/kodjodevf/isar-community-generator.git
            ref: v3

flutter:
    uses-material-design: true
